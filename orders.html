<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders — KRYPTAA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #d2ae5b;
      --gold-dim: rgba(210,174,91,0.35);
      --gold-faint: rgba(210,174,91,0.12);
      --bg: #0c0b09;
      --surface: #111009;
      --surface2: #161410;
      --text: #f0ede8;
      --text-dim: rgba(240,237,232,0.6);
      --text-faint: rgba(240,237,232,0.35);
      --border: rgba(210,174,91,0.18);
    }

    html, body { min-height: 100vh; background: var(--bg); color: var(--text); font-family: 'Cormorant Garamond', Georgia, serif; }

    /* ─── GATE ─── */
    #gate {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px;
    }
    .gate-card {
      width: 100%; max-width: 380px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 48px 40px;
      text-align: center;
    }
    .gate-wordmark {
      font-family: 'Cinzel Decorative', serif;
      font-size: 22px; font-weight: 900;
      background: linear-gradient(135deg, #c9a84c 0%, #f0d578 45%, #b8932e 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; letter-spacing: 0.08em; margin-bottom: 6px;
    }
    .gate-sub {
      font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--text-faint); margin-bottom: 40px;
    }
    .gate-label {
      font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase;
      color: var(--gold-dim); text-align: left; margin-bottom: 8px;
    }
    .gate-input {
      width: 100%; background: rgba(0,0,0,0.4); border: 1px solid var(--border);
      color: var(--text); font-family: inherit; font-size: 15px;
      padding: 14px 16px; outline: none; margin-bottom: 16px;
      transition: border-color 0.2s;
    }
    .gate-input:focus { border-color: var(--gold-dim); }
    .gate-btn {
      width: 100%; background: var(--gold); color: #070604;
      font-family: 'Cormorant Garamond', serif; font-size: 11px;
      letter-spacing: 0.25em; text-transform: uppercase;
      padding: 14px; border: none; cursor: pointer;
      font-weight: 700; transition: opacity 0.2s;
    }
    .gate-btn:hover { opacity: 0.88; }
    .gate-error {
      margin-top: 16px; font-size: 13px; color: #e07070;
      letter-spacing: 0.05em; display: none;
    }

    /* ─── DASHBOARD ─── */
    #dashboard { display: none; min-height: 100vh; }

    .od-header {
      position: sticky; top: 0; z-index: 10;
      background: rgba(12,11,9,0.97); backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
      display: flex; align-items: center; justify-content: space-between;
      height: 60px;
    }
    .od-header-logo {
      font-family: 'Cinzel Decorative', serif; font-size: 16px; font-weight: 900;
      background: linear-gradient(135deg, #c9a84c 0%, #f0d578 45%, #b8932e 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; letter-spacing: 0.06em;
    }
    .od-header-right { display: flex; align-items: center; gap: 12px; }
    .od-header-label {
      font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--text-faint);
    }
    .od-btn-ghost {
      background: none; border: 1px solid var(--border);
      color: var(--text-dim); font-family: inherit; font-size: 11px;
      letter-spacing: 0.2em; text-transform: uppercase;
      padding: 8px 16px; cursor: pointer; transition: border-color 0.2s, color 0.2s;
    }
    .od-btn-ghost:hover { border-color: var(--gold-dim); color: var(--gold); }

    .od-main { max-width: 920px; margin: 0 auto; padding: 36px 24px; }

    /* Stats bar */
    .od-stats {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 16px; margin-bottom: 36px;
      padding-bottom: 28px; border-bottom: 1px solid var(--border);
    }
    .od-stats-group { display: flex; gap: 40px; }
    .od-stat { display: flex; flex-direction: column; }
    .od-stat-val {
      font-size: 34px; font-weight: 400; color: var(--gold);
      font-variant-numeric: tabular-nums; line-height: 1;
    }
    .od-stat-lbl {
      font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase;
      color: var(--text-faint); margin-top: 5px;
    }

    /* Search */
    .od-search-wrap { position: relative; }
    .od-search {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); font-family: inherit; font-size: 15px;
      padding: 11px 16px 11px 40px; outline: none; width: 240px;
      transition: border-color 0.2s;
    }
    .od-search:focus { border-color: var(--gold-dim); }
    .od-search::placeholder { color: var(--text-faint); }
    .od-search-icon {
      position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
      color: var(--text-faint); pointer-events: none; font-size: 15px;
    }

    /* Order cards */
    #ordersList { display: flex; flex-direction: column; gap: 20px; }

    .order-card {
      background: var(--surface); border: 1px solid var(--border);
      overflow: hidden;
    }

    /* Card header — date + order number + total */
    .order-card-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--gold-faint);
      background: rgba(210,174,91,0.05);
      gap: 16px;
    }
    .order-head-left { display: flex; align-items: center; gap: 16px; }
    .order-num {
      font-family: 'Cinzel Decorative', serif;
      font-size: 20px; font-weight: 900; color: var(--gold);
      letter-spacing: 0.04em; white-space: nowrap;
      border-right: 1px solid var(--gold-faint);
      padding-right: 16px;
      line-height: 1;
    }
    .order-date {
      font-size: 13px; letter-spacing: 0.1em;
      color: var(--text-dim); text-transform: uppercase;
    }
    .order-total {
      font-size: 26px; color: var(--gold);
      font-variant-numeric: tabular-nums; font-weight: 400;
      white-space: nowrap;
    }

    /* Body */
    .order-body { padding: 20px 24px; }

    /* Items */
    .order-items { display: flex; flex-direction: column; gap: 12px; margin-bottom: 0; }
    .order-item { display: flex; align-items: center; gap: 16px; }
    .order-item-thumb {
      width: 60px; height: 76px; flex-shrink: 0;
      background: var(--surface2); border: 1px solid var(--border);
      overflow: hidden; display: flex; align-items: center; justify-content: center;
    }
    .order-item-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .order-item-thumb .thumb-placeholder {
      font-family: 'Cinzel Decorative', serif;
      font-size: 18px; color: var(--gold-dim);
    }
    .order-item-info { flex: 1; min-width: 0; }
    .order-item-name {
      font-size: 17px; color: var(--text); line-height: 1.3;
    }
    .order-item-meta {
      font-size: 13px; letter-spacing: 0.06em; color: var(--text-dim); margin-top: 4px;
    }
    .order-item-price {
      font-size: 17px; color: var(--text-dim); flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    /* Shipping row (text-only, no thumbnail) */
    .order-shipping-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 0; margin-top: 4px;
      border-top: 1px solid var(--gold-faint);
    }
    .order-shipping-lbl {
      font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--text-faint);
    }
    .order-shipping-amt {
      font-size: 14px; color: var(--text-faint);
      font-variant-numeric: tabular-nums;
    }

    /* Divider */
    .order-divider { height: 1px; background: var(--gold-faint); margin: 18px 0; }

    /* Customer row */
    .order-customer {
      display: flex; flex-wrap: wrap; gap: 14px 32px;
      align-items: flex-start; justify-content: space-between;
    }
    .order-customer-left { display: flex; flex-direction: column; gap: 5px; }
    .order-cname { font-size: 18px; color: var(--text); font-weight: 600; }
    .order-cdetail { font-size: 14px; letter-spacing: 0.04em; color: var(--text-dim); }
    .order-addr {
      font-size: 14px; letter-spacing: 0.03em; color: var(--text-faint);
      max-width: 340px; line-height: 1.65;
    }
    .order-actions { display: flex; gap: 10px; align-self: flex-end; flex-wrap: wrap; }
    .order-stripe-link {
      display: inline-block;
      background: var(--gold); color: #070604;
      font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
      padding: 10px 20px; text-decoration: none; font-weight: 700;
      white-space: nowrap; transition: opacity 0.2s;
    }
    .order-stripe-link:hover { opacity: 0.85; }
    .order-print-btn {
      display: inline-block;
      background: none; border: 1px solid var(--border); color: var(--text-dim);
      font-family: 'Cormorant Garamond', serif;
      font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
      padding: 10px 20px; cursor: pointer; white-space: nowrap;
      transition: border-color 0.2s, color 0.2s;
    }
    .order-print-btn:hover { border-color: var(--gold-dim); color: var(--gold); }

    /* Loading / empty */
    .od-loading {
      text-align: center; padding: 80px 24px;
      font-size: 13px; letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--text-faint);
    }
    .od-loading-dots::after { content: ''; animation: dots 1.4s infinite; }
    @keyframes dots {
      0%,20%  { content: '.'; }
      40%     { content: '..'; }
      60%,100%{ content: '...'; }
    }
    .od-empty {
      text-align: center; padding: 80px 24px;
      font-size: 15px; color: var(--text-faint); font-style: italic;
    }

    @media (max-width: 640px) {
      .od-stats-group { gap: 24px; }
      .od-stat-val { font-size: 26px; }
      .od-search { width: 180px; font-size: 14px; }
      .od-header-label { display: none; }
      .order-card-head { padding: 14px 16px; flex-wrap: wrap; }
      .order-body { padding: 16px; }
      .order-num { font-size: 16px; }
      .order-total { font-size: 20px; }
      .order-customer { flex-direction: column; }
      .order-actions { align-self: flex-start; }
      .order-cname { font-size: 16px; }
    }
  </style>
</head>
<body>

<!-- PASSWORD GATE -->
<div id="gate">
  <div class="gate-card">
    <div class="gate-wordmark">KRYPTAA</div>
    <div class="gate-sub">Orders Dashboard</div>
    <div class="gate-label">Admin Password</div>
    <input class="gate-input" type="password" id="gateInput" placeholder="Enter password" autocomplete="current-password">
    <button class="gate-btn" id="gateBtn">Enter →</button>
    <div class="gate-error" id="gateError">Incorrect password. Try again.</div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <header class="od-header">
    <div class="od-header-logo">KRYPTAA</div>
    <div class="od-header-right">
      <span class="od-header-label">Orders Dashboard</span>
      <button class="od-btn-ghost" id="refreshBtn">↺ Refresh</button>
      <button class="od-btn-ghost" id="logoutBtn">Logout</button>
    </div>
  </header>

  <main class="od-main">
    <div class="od-stats" id="statsBar">
      <div class="od-stats-group">
        <div class="od-stat">
          <span class="od-stat-val" id="statOrders">—</span>
          <span class="od-stat-lbl">Total Orders</span>
        </div>
        <div class="od-stat">
          <span class="od-stat-val" id="statRevenue">—</span>
          <span class="od-stat-lbl">Revenue</span>
        </div>
        <div class="od-stat">
          <span class="od-stat-val" id="statItems">—</span>
          <span class="od-stat-lbl">Items Sold</span>
        </div>
      </div>
      <div class="od-search-wrap">
        <span class="od-search-icon">⌕</span>
        <input class="od-search" type="search" id="searchInput" placeholder="Search customer or item…">
      </div>
    </div>

    <div id="ordersList">
      <div class="od-loading"><span class="od-loading-dots">Loading orders</span></div>
    </div>
  </main>
</div>

<script>
(function () {
  var BACKEND = 'https://kryptaa-backend.netlify.app/.netlify/functions/get-orders';
  var SESSION_KEY = 'k_admin_key';

  var gate = document.getElementById('gate');
  var dashboard = document.getElementById('dashboard');
  var gateInput = document.getElementById('gateInput');
  var gateBtn = document.getElementById('gateBtn');
  var gateError = document.getElementById('gateError');
  var ordersList = document.getElementById('ordersList');
  var searchInput = document.getElementById('searchInput');
  var statOrders = document.getElementById('statOrders');
  var statRevenue = document.getElementById('statRevenue');
  var statItems = document.getElementById('statItems');

  var allOrders = [];

  function savedKey() { try { return sessionStorage.getItem(SESSION_KEY); } catch (e) { return null; } }
  function saveKey(k) { try { sessionStorage.setItem(SESSION_KEY, k); } catch (e) {} }
  function clearKey() { try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {} }

  function showDashboard() { gate.style.display = 'none'; dashboard.style.display = 'block'; }
  function showGate(errMsg) {
    dashboard.style.display = 'none'; gate.style.display = 'flex';
    if (errMsg) { gateError.textContent = errMsg; gateError.style.display = 'block'; }
  }

  function isShipping(item) {
    var n = (item.name || '').toLowerCase();
    return n === 'shipping' || n === 'standard shipping' || n === 'express shipping' || n === 'free shipping';
  }

  function loadOrders(key) {
    ordersList.innerHTML = '<div class="od-loading"><span class="od-loading-dots">Loading orders</span></div>';
    fetch(BACKEND, { headers: { 'X-Admin-Key': key } })
      .then(function (r) {
        if (r.status === 401) { clearKey(); showGate('Incorrect password. Try again.'); return null; }
        if (!r.ok) throw new Error('Server error ' + r.status);
        return r.json();
      })
      .then(function (data) {
        if (!data) return;
        allOrders = data.orders || [];
        renderStats(allOrders);
        renderOrders(allOrders);
      })
      .catch(function (err) {
        ordersList.innerHTML = '<div class="od-empty">Could not load orders: ' + err.message + '</div>';
      });
  }

  function renderStats(orders) {
    var revenue = orders.reduce(function (s, o) { return s + parseFloat(o.total || 0); }, 0);
    var items = orders.reduce(function (s, o) {
      return s + (o.items || []).filter(function(i){ return !isShipping(i); })
        .reduce(function (si, i) { return si + (i.qty || 1); }, 0);
    }, 0);
    statOrders.textContent = orders.length;
    statRevenue.textContent = '$' + revenue.toFixed(2);
    statItems.textContent = items;
  }

  function renderOrders(orders) {
    if (!orders.length) {
      ordersList.innerHTML = '<div class="od-empty">No orders found.</div>';
      return;
    }

    var total = orders.length;

    ordersList.innerHTML = orders.map(function (o, idx) {
      /* Oldest order = #1, newest = #N */
      var orderNum = total - idx;

      var date = new Date(o.created * 1000);
      var dateStr = date.toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' })
        + ' · '
        + date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });

      var productItems = (o.items || []).filter(function(i){ return !isShipping(i); });
      var shippingItem = (o.items || []).find(function(i){ return isShipping(i); });

      var itemsHtml = productItems.map(function (item) {
        var thumbHtml = item.image
          ? '<img src="' + item.image + '" alt="' + escHtml(item.name) + '" onerror="this.parentNode.innerHTML=\'<span class=thumb-placeholder>K</span>\'">'
          : '<span class="thumb-placeholder">K</span>';
        return '<div class="order-item">'
          + '<div class="order-item-thumb">' + thumbHtml + '</div>'
          + '<div class="order-item-info">'
          + '<div class="order-item-name">' + escHtml(item.name || '—') + '</div>'
          + '<div class="order-item-meta">Qty ' + (item.qty || 1) + '</div>'
          + '</div>'
          + '<div class="order-item-price">$' + (item.total || '0.00') + '</div>'
          + '</div>';
      }).join('');

      var shippingHtml = shippingItem
        ? '<div class="order-shipping-row"><span class="order-shipping-lbl">Shipping</span><span class="order-shipping-amt">$' + shippingItem.total + '</span></div>'
        : '';

      var stripeUrl = o.paymentId && o.paymentId.startsWith('pi_')
        ? 'https://dashboard.stripe.com/payments/' + o.paymentId
        : 'https://dashboard.stripe.com/payments';

      return '<div class="order-card" data-search="'
        + escAttr(('#' + orderNum + ' ' + o.customer.name + ' ' + o.customer.email + ' ' + productItems.map(function(i){return i.name;}).join(' ')).toLowerCase())
        + '">'
        + '<div class="order-card-head">'
        + '<div class="order-head-left">'
        + '<div class="order-num">#' + orderNum + '</div>'
        + '<div class="order-date">' + dateStr + '</div>'
        + '</div>'
        + '<div class="order-total">$' + o.total + '</div>'
        + '</div>'
        + '<div class="order-body">'
        + '<div class="order-items">' + itemsHtml + '</div>'
        + shippingHtml
        + '<div class="order-divider"></div>'
        + '<div class="order-customer">'
        + '<div class="order-customer-left">'
        + '<div class="order-cname">' + escHtml(o.customer.name) + '</div>'
        + '<div class="order-cdetail">' + escHtml(o.customer.email) + '</div>'
        + (o.customer.phone && o.customer.phone !== '—' ? '<div class="order-cdetail">' + escHtml(o.customer.phone) + '</div>' : '')
        + '</div>'
        + '<div class="order-addr">' + escHtml(o.shippingAddress) + '</div>'
        + '<div class="order-actions">'
        + '<button class="order-print-btn" type="button" onclick="printLabel(' + JSON.stringify(o).replace(/</g,'\\u003c') + ',' + orderNum + ')">Print Label ⎙</button>'
        + '<a class="order-stripe-link" href="' + stripeUrl + '" target="_blank" rel="noopener">View in Stripe →</a>'
        + '</div>'
        + '</div>'
        + '</div>'
        + '</div>';
    }).join('');
  }

  /* ── Search ── */
  searchInput.addEventListener('input', function () {
    var q = this.value.toLowerCase().trim();
    var cards = ordersList.querySelectorAll('.order-card');
    var shown = 0;
    cards.forEach(function (card) {
      var match = !q || (card.dataset.search || '').includes(q);
      card.style.display = match ? '' : 'none';
      if (match) shown++;
    });
    var noRes = ordersList.querySelector('.od-no-results');
    if (!shown && q) {
      if (!noRes) {
        var d = document.createElement('div');
        d.className = 'od-empty od-no-results';
        d.textContent = 'No orders match "' + q + '".';
        ordersList.appendChild(d);
      }
    } else if (noRes) { noRes.remove(); }
  });

  /* ── Gate ── */
  function tryLogin() {
    var key = gateInput.value.trim();
    if (!key) return;
    gateError.style.display = 'none';
    gateBtn.disabled = true; gateBtn.textContent = 'Checking…';
    fetch(BACKEND, { headers: { 'X-Admin-Key': key } })
      .then(function (r) {
        gateBtn.disabled = false; gateBtn.textContent = 'Enter →';
        if (r.status === 401) {
          gateError.textContent = 'Incorrect password. Try again.';
          gateError.style.display = 'block'; return null;
        }
        if (!r.ok) throw new Error('Server error');
        return r.json();
      })
      .then(function (data) {
        if (!data) return;
        saveKey(key);
        showDashboard();
        allOrders = data.orders || [];
        renderStats(allOrders);
        renderOrders(allOrders);
      })
      .catch(function () {
        gateBtn.disabled = false; gateBtn.textContent = 'Enter →';
        gateError.textContent = 'Network error. Check your connection.';
        gateError.style.display = 'block';
      });
  }

  gateBtn.addEventListener('click', tryLogin);
  gateInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') tryLogin(); });
  document.getElementById('refreshBtn').addEventListener('click', function () {
    var key = savedKey(); if (key) loadOrders(key);
  });
  document.getElementById('logoutBtn').addEventListener('click', function () {
    clearKey(); showGate(); gateInput.value = ''; gateError.style.display = 'none';
  });

  function escHtml(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function escAttr(str) { return escHtml(str); }

  var key = savedKey();
  if (key) { showDashboard(); loadOrders(key); } else { showGate(); }
})();

function printLabel(order, orderNum) {
  var date = new Date(order.created * 1000).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  var productItems = (order.items || []).filter(function(i){
    var n = (i.name||'').toLowerCase();
    return n !== 'shipping' && n !== 'standard shipping' && n !== 'express shipping' && n !== 'free shipping';
  });
  var shippingItem = (order.items || []).find(function(i){
    var n = (i.name||'').toLowerCase();
    return n === 'shipping' || n === 'standard shipping' || n === 'express shipping' || n === 'free shipping';
  });
  var itemsHtml = productItems.map(function (i) {
    return '<tr><td style="padding:6px 0;font-size:14px;border-bottom:1px solid #eee;">' + (i.name||'') + '</td>'
      + '<td style="padding:6px 8px;font-size:14px;text-align:center;border-bottom:1px solid #eee;">' + (i.qty||1) + '</td>'
      + '<td style="padding:6px 0;font-size:14px;text-align:right;border-bottom:1px solid #eee;">$' + i.total + '</td></tr>';
  }).join('');
  var ref = (order.paymentId || order.id || '').slice(-8).toUpperCase();
  var w = window.open('', '_blank', 'width=620,height=760');
  w.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>KRYPTAA — Order #' + orderNum + '</title>'
    + '<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@900&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">'
