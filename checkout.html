<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - KRYPTAA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;600;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="global.css?v=luxury-v3-6">
<script defer src="products.js?v=luxury-v3-6"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

</head>
<body data-page="checkout">
<div class="k-grain"></div>
<main class="checkout-page">
  <div class="section-shell checkout-grid">
    <section class="reveal">
      <div class="eyebrow">Secure Preview</div>
      <h1 class="checkout-title">Checkout</h1>
      <p>This local checkout preview keeps the bag flow intact while the payment layer is still outside this static build. The presentation stays premium so the final commerce step matches the rest of the launch.</p>
      <div class="hero-actions">
        <a class="k-btn-outline" href="men.html">Continue Shopping</a>
      </div>
    </section>
    <aside class="checkout-panel reveal">
      <div class="eyebrow">Order Summary</div>
      <div class="checkout-items" id="checkoutItems"></div>
      <div class="checkout-total">
        <span>Total</span>
        <span id="checkoutTotal">$0.00</span>
      </div>
    </aside>
  </div>
</main>
</body>
</html>
