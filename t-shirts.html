<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop — KRYPTAA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="global.css">
<style>
  .shop-page {
    padding-top: 100px;
    background: var(--k-black);
    min-height: 100vh;
  }

  .shop-hero {
    height: 35vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    border-bottom: 1px solid var(--k-border);
    position: relative;
    overflow: hidden;
    background: #050505;
  }

  .shop-hero h1 {
    font-size: clamp(3rem, 6vw, 6rem);
    margin: 0;
    line-height: 1;
    z-index: 2;
    letter-spacing: 0.1em;
  }

  .shop-hero p {
    font-family: var(--f-mono);
    font-size: 0.6rem;
    color: var(--k-gold);
    letter-spacing: 0.5em;
    text-transform: uppercase;
    margin-top: 15px;
    z-index: 2;
  }

  .controls-bar {
    position: sticky;
    top: 80px;
    z-index: 100;
    background: rgba(0,0,0,0.9);
    backdrop-filter: blur(15px);
    border-bottom: 1px solid var(--k-border);
    padding: 12px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .grid-toggles {
    display: flex;
    gap: 25px;
  }

  .view-btn {
    background: none;
    border: none;
    color: var(--k-muted);
    font-family: var(--f-mono);
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    cursor: pointer;
    transition: all 0.3s ease;
    text-transform: uppercase;
    padding: 5px 0;
    position: relative;
  }

  .view-btn::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 0;
    height: 1px;
    background: var(--k-gold);
    transition: width 0.3s ease;
  }

  .view-btn.active {
    color: var(--k-white);
  }

  .view-btn.active::after {
    width: 100%;
  }

  .products-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--k-border);
    border-bottom: 1px solid var(--k-border);
  }

  .products-grid.cols-2 {
    grid-template-columns: repeat(2, 1fr);
  }

  .luxury-card {
    background: var(--k-black);
    padding: 50px 40px;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
  }

  .luxury-card:hover {
    background: #0a0a0a;
  }

  .card-img-wrap {
    width: 100%;
    aspect-ratio: 3/4;
    overflow: hidden;
    margin-bottom: 35px;
    background: #111;
  }

  .card-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 1.5s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .luxury-card:hover .card-img-wrap img {
    transform: scale(1.1);
  }

  .card-info {
    text-align: center;
  }

  .card-cat {
    font-family: var(--f-mono);
    font-size: 0.55rem;
    color: var(--k-gold);
    letter-spacing: 0.4em;
    text-transform: uppercase;
    margin-bottom: 12px;
    display: block;
    opacity: 0.8;
  }

  .card-name {
    font-family: var(--f-primary);
    font-size: 1.1rem;
    margin-bottom: 12px;
    letter-spacing: 0.03em;
    font-weight: 400;
  }

  .card-price {
    font-family: var(--f-mono);
    font-size: 0.75rem;
    color: var(--k-muted);
  }

  @media (max-width: 1100px) {
    .products-grid { grid-template-columns: repeat(2, 1fr); }
    .products-grid.cols-2 { grid-template-columns: 1fr; }
  }

  @media (max-width: 768px) {
    .luxury-card { padding: 30px 20px; }
    .controls-bar { padding: 10px 20px; }
  }
</style>
</head>
<body>

<div class="k-grain"></div>

<nav id="navbar" class="scrolled">
  <a href="index.html" class="nav-brand">
    <img class="nav-logo-img" src="imgs/kryptaa-logo-gold.png" alt="KRYPTAA" style="opacity: 1;">
  </a>
  <div class="nav-links">
    <a href="men.html" id="nav-men">Men</a>
    <a href="women.html" id="nav-women">Women</a>
    <a href="jeans.html" id="nav-jeans">Jeans</a>
    <a href="t-shirts.html" id="nav-tees">T-Shirts</a>
  </div>
  <button class="k-btn-gold" onclick="openCart()">Bag (<span id="cartCountNav">0</span>)</button>
</nav>

<div class="cart-overlay" id="cartOverlay"></div>
<div class="cart-drawer" id="cartDrawer">
  <div class="cart-header">
    <h3>BAG (<span id="cartCount">0</span>)</h3>
    <button class="cart-close-btn" onclick="closeCart()">CLOSE</button>
  </div>
  <div class="cart-body" id="cartItemsList"></div>
  <div class="cart-footer">
    <div class="cart-total">
      <span>TOTAL</span>
      <span>$<span id="cartTotalAmount">0</span></span>
    </div>
    <a href="checkout.html" class="k-btn-gold" style="width: 100%; text-align: center;">Checkout Now</a>
  </div>
</div>

<main class="shop-page">
  <header class="shop-hero">
    <p id="shopSub">Collection // SS26</p>
    <h1 id="shopTitle">SHOP</h1>
  </header>

  <div class="controls-bar">
    <div class="grid-toggles">
      <button class="view-btn active" id="grid4Btn" onclick="setGrid(4)">Grid 04</button>
      <button class="view-btn" id="grid2Btn" onclick="setGrid(2)">Grid 02</button>
    </div>
    <div id="itemCount" style="font-family: var(--f-mono); font-size: 0.6rem; color: var(--k-muted); letter-spacing: 0.1em;">0 ITEMS</div>
  </div>

  <div class="products-grid" id="productsGrid">
    <!-- Products injected here -->
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.19/dist/lenis.min.js"></script>
<script src="products.js"></script>
<script src="motion.js"></script>
<script>
  gsap.registerPlugin(ScrollTrigger);

  const PAGE_CONFIG = {
    'men.html': { title: 'MEN', cat: 'men', navId: 'nav-men' },
    'women.html': { title: 'WOMEN', cat: 'women', navId: 'nav-women' },
    'jeans.html': { title: 'JEANS', cat: 'all_jeans', navId: 'nav-jeans' },
    't-shirts.html': { title: 'T-SHIRTS', cat: 'tees', navId: 'nav-tees' },
    'anime.html': { title: 'ANIME', cat: 'anime', navId: '' },
    'track-pants.html': { title: 'TRACK PANTS', cat: 'men', navId: '' }
  };

  function initPage() {
    const filename = window.location.pathname.split('/').pop() || 'men.html';
    const config = PAGE_CONFIG[filename] || PAGE_CONFIG['men.html'];

    document.title = `${config.title} — KRYPTAA`;
    document.getElementById('shopTitle').textContent = config.title;
    if (config.navId) document.getElementById(config.navId).classList.add('active');

    renderProducts(config.cat);
  }

  function renderProducts(cat) {
    const grid = document.getElementById('productsGrid');
    let products = [];

    if (cat === 'all_jeans') {
      products = PRODUCTS.filter(p => p.name.toLowerCase().includes('denim') || p.name.toLowerCase().includes('jeans'));
    } else {
      products = getProductsByCategory(cat);
    }

    document.getElementById('itemCount').textContent = `${products.length} ITEMS`;

    grid.innerHTML = products.map((p, index) => `
      <div class="luxury-card" onclick="window.location.href='product-detail.html?id=${p.id}'">
        <div class="card-img-wrap">
          <img src="${p.img}" alt="${p.name}" loading="lazy">
        </div>
        <div class="card-info">
          <span class="card-cat">${p.category} // Kryptaa</span>
          <h2 class="card-name">${p.name}</h2>
          <div class="card-price">$${p.price}.00</div>
        </div>
      </div>
    `).join('');

    // Staggered reveal
    gsap.from(".luxury-card", {
      opacity: 0,
      y: 60,
      duration: 1.2,
      stagger: 0.1,
      ease: "power4.out",
      scrollTrigger: {
        trigger: grid,
        start: "top 90%"
      }
    });
  }

  function setGrid(cols) {
    const grid = document.getElementById('productsGrid');
    const g4 = document.getElementById('grid4Btn');
    const g2 = document.getElementById('grid2Btn');

    if (cols === 2) {
      grid.classList.add('cols-2');
      g2.classList.add('active');
      g4.classList.remove('active');
    } else {
      grid.classList.remove('cols-2');
      g4.classList.add('active');
      g2.classList.remove('active');
    }

    // Refresh scrolltrigger because layout changed
    ScrollTrigger.refresh();
  }

  window.addEventListener('load', () => {
    initPage();
    if (typeof renderCartContent === 'function') renderCartContent();
  });
</script>
</body>
</html>
