<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KRYPTAA — Gothic Streetwear | SS26</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="global.css">
<style>
  .hero-v3 {
    height: 100vh;
    background: #000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
  }

  .hero-video {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    object-fit: cover;
    opacity: 0.4;
  }

  .hero-content {
    position: relative;
    z-index: 10;
    text-align: center;
  }

  .hero-title {
    font-size: clamp(4rem, 10vw, 12rem);
    line-height: 0.85;
    margin-bottom: 20px;
    letter-spacing: -0.02em;
  }

  .hero-sub {
    font-family: var(--f-mono);
    font-size: 0.7rem;
    letter-spacing: 0.6em;
    color: var(--k-gold);
    text-transform: uppercase;
    margin-bottom: 40px;
  }

  .featured-section {
    padding: 120px 40px;
    background: var(--k-black);
  }

  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 60px;
    border-bottom: 1px solid var(--k-border);
    padding-bottom: 30px;
  }

  .section-title {
    font-size: 3rem;
  }

  .section-link {
    font-family: var(--f-mono);
    font-size: 0.7rem;
    color: var(--k-gold);
    text-decoration: none;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  .featured-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 30px;
  }

  @media (max-width: 1024px) {
    .featured-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 600px) {
    .featured-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="k-grain"></div>

<nav id="navbar">
  <a href="index.html" class="nav-brand">
    <img src="imgs/kryptaa-logo-gold.png" alt="KRYPTAA">
  </a>
  <div class="nav-links">
    <a href="men.html">Men</a>
    <a href="women.html">Women</a>
    <a href="jeans.html">Jeans</a>
    <a href="t-shirts.html">T-Shirts</a>
  </div>
  <button class="k-btn-gold" onclick="openCart()">Bag (<span id="cartCountNav">0</span>)</button>
</nav>

<div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>
<div class="cart-drawer" id="cartDrawer">
  <div class="cart-header">
    <h3>BAG (<span id="cartCount">0</span>)</h3>
    <button class="cart-close-btn" onclick="closeCart()">CLOSE</button>
  </div>
  <div class="cart-body" id="cartItemsList"></div>
  <div class="cart-footer">
    <div class="cart-total">
      <span>TOTAL</span>
      <span>$<span id="cartTotalAmount">0</span></span>
    </div>
    <a href="checkout.html" class="k-btn-gold" style="display: block; text-align: center; text-decoration: none;">Checkout Now</a>
  </div>
</div>

<header class="hero-v3">
  <video class="hero-video" autoplay muted loop playsinline>
    <source src="imgs/Background.mp4" type="video/mp4">
  </video>
  <div class="hero-content">
    <p class="hero-sub">Defining Power // Driven by Aura</p>
    <h1 class="hero-title">KRYPTAA</h1>
    <div style="display: flex; gap: 20px; justify-content: center;">
      <a href="men.html" class="k-btn-gold">Shop Drop 001</a>
      <a href="anime.html" class="k-btn-gold" style="background: transparent; border: 1px solid var(--k-gold); color: var(--k-gold);">Anime Archive</a>
    </div>
  </div>
</header>

<section class="featured-section">
  <div class="section-header">
    <h2 class="section-title">Essential Drops</h2>
    <a href="men.html" class="section-link">View All →</a>
  </div>
  <div class="featured-grid" id="featuredGrid">
    <!-- Injected -->
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.19/dist/lenis.min.js"></script>
<script src="products.js"></script>
<script src="motion.js"></script>
<script>
  gsap.registerPlugin(ScrollTrigger);

  function initHome() {
    const grid = document.getElementById('featuredGrid');
    const featured = PRODUCTS.slice(0, 4);

    grid.innerHTML = featured.map(p => `
      <div class="luxury-card" onclick="window.location.href='product-detail.html?id=${p.id}'" style="padding: 0; background: none;">
        <div class="card-img-wrap" style="margin-bottom: 25px;">
          <img src="${p.img}" alt="${p.name}">
        </div>
        <div class="card-info">
          <span class="card-cat" style="font-size: 0.5rem;">${p.category} // Kryptaa</span>
          <h3 class="card-name" style="font-size: 1rem;">${p.name}</h3>
          <div class="card-price" style="font-size: 0.7rem;">$${p.price}.00</div>
        </div>
      </div>
    `).join('');

    gsap.from(".hero-content > *", { opacity: 0, y: 50, duration: 1.5, stagger: 0.2, ease: "power4.out" });

    gsap.from(".luxury-card", {
      opacity: 0,
      y: 100,
      stagger: 0.1,
      duration: 1.2,
      ease: "power3.out",
      scrollTrigger: {
        trigger: ".featured-section",
        start: "top 80%"
      }
    });
  }

  window.addEventListener('load', () => {
    initHome();
    if (typeof renderCartContent === 'function') renderCartContent();
  });
</script>
</body>
</html>
